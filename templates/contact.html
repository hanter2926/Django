{% extends 'base.html' %}

{% block content %}
<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            
            <h2 class="mb-4 text-center font-weight-bold">Contact Us</h2>
            <p class="text-muted text-center mb-4">Have any questions? Drop us a message and we'll get back to you soon.</p>
            
            <div class="card border-0 shadow-sm p-4 bg-light">
                <form method="POST" action="">
                    {% csrf_token %} <!-- Django security ke liye zaroori hai -->
                    
                    <div class="mb-3">
                        <label for="name" class="form-label">Your Name</label>
                        <input type="text" class="form-control" id="name" placeholder="John Doe" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="message" class="form-label">Message</label>
                        <textarea class="form-control" id="message" rows="4" placeholder="Type your message here..." required></textarea>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-dark">Send Message</button>
                    </div>
                </form>
            </div>
            
        </div>
    </div>
</div>
{% endblock %}
