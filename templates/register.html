<!DOCTYPE html>
<html>
<head>
    <title>Candy Register</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; margin: 0; }
        .box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        button { background: #3399ff; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>📝 Create Candy Account</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Register & Play</button>
        </form>
        <p style="font-size: 14px; margin-top: 15px;">Pehle se account hai? <a href="{% url 'login' %}" style="color: #3399ff;">Login Karein</a></p>
    </div>
</body>
</html>
