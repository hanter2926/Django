{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <div class="card border-0 shadow-sm p-4 bg-light">
        <h2 class="text-center mb-4">Login Account</h2>
        
        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label">Username / Email / Mobile Number</label>
                <input type="text" name="login_input" class="form-control" placeholder="Enter username, email, or mobile..." required>
            </div>
            
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
            
            <div class="text-center">
                <a href="{% url 'forget_password' %}" class="text-danger d-block mb-1">Forget Password?</a>
                <span class="text-muted">New user? </span><a href="{% url 'register' %}" class="text-success">Register Here</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
