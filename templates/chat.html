<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat with {{ friend.username }}</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 400px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); display: flex; flex-direction: column; height: 500px; }
        .chat-header { background: #ff758c; color: white; padding: 15px; font-weight: bold; border-top-left-radius: 10px; border-top-right-radius: 10px; display: flex; justify-content: space-between; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; background: #f9f9f9; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 15px; max-width: 70%; word-wrap: break-word; }
        .sent { background: #ff758c; color: white; margin-left: auto; border-bottom-right-radius: 0; }
        .received { background: #e4e6eb; color: black; margin-right: auto; border-bottom-left-radius: 0; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #eee; }
        .chat-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        .btn-send { background: #ff758c; color: white; border: none; padding: 0 15px; margin-left: 5px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .back-link { color: white; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span>💬 {{ friend.username }}</span>
        <a href="{% url 'social_dashboard' %}" class="back-link">✖ Close</a>
    </div>
    
    <div class="chat-messages" id="chat-box">
        </div>
    
    <div class="chat-input-area">
        {% csrf_token %}
        <input type="text" id="msg-input" class="chat-input" placeholder="Type a message...">
        <button onclick="sendMessage()" class="btn-send">Send</button>
    </div>
</div>

<script>
    const friendId = "{{ friend.id }}";
    const chatBox = document.getElementById('chat-box');

    // 1. Live Messages fetch karne ka function
    function fetchMessages() {
        fetch(`/chat/api/${friendId}/`)
        .then(response => response.json())
        .then(data => {
            chatBox.innerHTML = ''; // Box clear karke naye messages dikhana
            data.messages.forEach(msg => {
                const msgDiv = document.createElement('div');
                msgDiv.classList.add('message');
                
                // Check karna ki message humne bheja hai ya samne wale ne
                if (msg.sender === data.current_user) {
                    msgDiv.classList.add('sent');
                } else {
                    msgDiv.classList.add('received');
                }
                
                msgDiv.innerHTML = `<span>${msg.text}</span> <small style="display:block; font-size:10px; opacity:0.7; text-align:right;">${msg.time}</small>`;
                chatBox.appendChild(msgDiv);
            });
            // Auto scroll to bottom
            chatBox.scrollTop = chatBox.scrollHeight;
        });
    }

    // 2. Message Send karne ka function
    function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        const token = document.querySelector('[name=csrfmiddlewaretoken]').value;

        fetch(`/chat/api/${friendId}/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': token
            },
            body: JSON.stringify({ 'message_text': text })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 'sent') {
                input.value = ''; // Input clear karna
                fetchMessages(); // Instant refresh box
            }
        });
    }

    // Enter key dabane par bhi message send ho jaye
    document.getElementById('msg-input').addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });

    // Har 2 second (2000 milliseconds) me chat box check karega naye messages ke liye
    setInterval(fetchMessages, 2000);
    fetchMessages(); // Pehli baar page khulte hi run ho jaye
</script>

</body>
</html>
