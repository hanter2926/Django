{% extends 'base.html' %}
{% block content %}
<div class="container mt-5" style="max-width: 500px;">
    <h2>Verify OTP & Reset Password</h2>
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3"><label>Enter 6-Digit OTP</label><input type="text" name="otp" class="form-control" required></div>
        <div class="mb-3"><label>New Password</label><input type="password" name="new_password" class="form-control" required></div>
        <button type="submit" class="btn btn-dark w-100">Update Password</button>
    </form>
</div>
{% endblock %}
