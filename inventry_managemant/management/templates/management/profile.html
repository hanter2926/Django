<!DOCTYPE html>
<html>
<head>
    <title>Product App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% extends 'base.html' %}
    {% load static %}
    
{% block content %}
<link rel="stylesheet" href="{% static 'css/profile.css' %}">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <img src="{{ user.profile.dp.url }}" class="rounded-circle shadow" width="150" height="150" style="object-fit: cover;">
            
            <h2 class="mt-3">{{ user.username }}</h2>
            <p class="text-muted"><em>"{{ user.profile.bio }}"</em></p>
            
            <a href="{% url 'profile_settings' %}" class="btn btn-outline-success btn-sm">Edit Profile Setting</a>
            <hr>

            <h4 class="text-left">Your Stories</h4>
            <div class="d-flex overflow-auto py-2">
                {% for story in stories %}
                    <div class="mr-3 text-center">
                        <img src="{{ story.image.url }}" class="rounded-circle border border-success p-1" width="70" height="70" style="object-fit: cover;">
                        <br><small>{{ story.created_at|timesince }} ago</small>
                    </div>
                {% empty %}
                    <p class="text-muted">No stories yet. <a href="{% url 'upload_story' %}">Add one!</a></p>
                {% endfor %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
</body>
</html>
