<!DOCTYPE html>
<html>
<head>
    <title>Product App</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-4">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <div class="d-flex justify-content-between mb-4">

        <h2>Product App</h2>

        <div>

            {% if user.is_authenticated %}

                <a href="{% url 'product_create' %}" class="btn btn-success">
                    Add Product
                </a>

                <form action="/accounts/logout/" method="POST" class="d-inline">
                    {% csrf_token %}

                    <button type="submit" class="btn btn-danger">
                        Logout
                    </button>
                </form>

            {% else %}
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'profile' %}">
                       <img src="{{ request.user.profile.dp.url }}" width="30" height="30" class="rounded-circle">
                       My Profile
                   </a>
                </li>

                <a href="{% url 'login' %}" class="btn btn-primary">
                    Login
                </a>

                <a href="{% url 'register' %}" class="btn btn-warning">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
